# Local fleet server — offline/conference fallback for Qdrant Cloud (PLAN.md §3.6).
# Same version the sync spike verified against Edge 0.7.2.
services:
  fleet:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - fleet-storage:/qdrant/storage

volumes:
  fleet-storage:
