[project]
name = "fleetmemory"
version = "0.1.0"
description = "Fleet Memory — shared object memory on Qdrant Edge (demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qdrant-edge-py==0.7.2",   # beta, API drifts between minors — sync test is the canary
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "numpy>=2.0.0,<2.3.0",
    "qdrant-client>=1.15",  # fleet push (upsert) — pulls stay native snapshots
    "requests>=2.32",  # snapshot downloads (iter_content — r.raw corrupts the tar)
]

[project.optional-dependencies]
# Real models — needed to run the app and the smoke/drive tests, but not by
# CI (lint + deterministic gate + sync tests run model-free, PLAN.md §7).
perception = [
    "ultralytics>=8.3",
    "lap>=0.5.12",  # BoT-SORT assignment; ultralytics runtime auto-install is disabled
    "fastembed>=0.7.4",
    "opencv-python>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Spike scripts are frozen measurement evidence (PLAN.md §9), not product code.
extend-exclude = ["docs/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real models, local only (deselected in CI)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleetmemory"]
